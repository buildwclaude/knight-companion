name: Build APK

# Build on every push to main, and whenever you click "Run workflow" in the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allow the workflow to publish GitHub Releases (needed to attach the APK).
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Compile + assemble the debug APK. If the code doesn't compile, nothing gets published.
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs (standard + herald editions)
        run: ./gradlew assembleStandardDebug assembleHeraldDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk knight-companion-latest.apk
          cp app/build/outputs/apk/herald/debug/app-herald-debug.apk knight-companion-herald.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: knight-companion-debug-apk
          path: |
            knight-companion-latest.apk
            knight-companion-herald.apk
          if-no-files-found: error

  # 2. Android Lint, in parallel. A lint error fails the pipeline.
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lintStandardDebug lintHeraldDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # 3. Publish the APK to a rolling "latest" release, only after build AND lint pass.
  release:
    name: Publish to Releases
    needs: [ build, lint ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: knight-companion-debug-apk

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          NOTES="Automatic debug build from commit ${SHORT_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC').

          **How to install:** download \`knight-companion-latest.apk\` below on your phone and open it. You may need to allow your browser to install unknown apps (see the README).

          \`knight-companion-herald.apk\` adds the notification herald. Play Protect blocks sideloading it in some countries; see the README for how to install it."
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest knight-companion-latest.apk knight-companion-herald.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ($SHORT_SHA)" \
            --notes "$NOTES" \
            --latest
